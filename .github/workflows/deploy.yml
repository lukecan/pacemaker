name: Deploy website

# Publishes site/ and worker/ to Cloudflare Workers (free plan).
# Needs two repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
# Until they exist this workflow only runs the tests and says so.

on:
  push:
    branches: [main]
    paths: ["site/**", "worker/**", "wrangler.jsonc", "package.json", "test/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test
        run: node --test test/*.test.mjs

      - name: Check for Cloudflare credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare is not set up yet. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets, then run this workflow again."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install wrangler
        if: steps.creds.outputs.ready == 'true'
        run: npm install --no-save wrangler@4.40.0

      - name: Create the database on first run
        if: steps.creds.outputs.ready == 'true'
        run: |
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="pacemaker") | .uuid' | head -1)
          if [ -z "$id" ]; then
            npx wrangler d1 create pacemaker
            id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="pacemaker") | .uuid' | head -1)
          fi
          if [ -z "$id" ]; then echo "::error::Could not find or create the D1 database"; exit 1; fi
          sed -i "s/00000000-0000-0000-0000-000000000000/$id/" wrangler.jsonc
          echo "database: $id"

      - name: Apply database migrations
        if: steps.creds.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply pacemaker --remote

      - name: Deploy
        if: steps.creds.outputs.ready == 'true'
        run: |
          set -o pipefail
          npx wrangler deploy < /dev/null 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$url" ]; then
            if grep -q "register a workers.dev subdomain" deploy.log; then
              echo "::error::Your Cloudflare account has no workers.dev subdomain yet. In the Cloudflare dashboard open Workers & Pages and choose one, then run this workflow again."
            else
              echo "::error::Deploy finished without a workers.dev address; see the log above."
            fi
            exit 1
          fi
          echo "### pacemaker is live" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
          echo "url=$url" >> "$GITHUB_OUTPUT"
        id: deploy

      - name: Check the live site against real Deezer
        if: steps.creds.outputs.ready == 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          # a new workers.dev address can take a minute to answer
          for i in $(seq 1 24); do
            curl -sf "$URL/api/health" >/dev/null && break
            sleep 5
          done
          curl -sf "$URL/api/health"
          curl -sf "$URL/" | grep -q "<title>pacemaker</title>" || { echo "::error::home page missing"; exit 1; }
          body='{"songs":[{"key":"GBUM70603730","title":"Rehab","artist":"Amy Winehouse","isrc":"GBUM70603730"},{"key":"africa|toto","title":"Africa","artist":"Toto"}]}'
          res=$(curl -sf -X POST "$URL/api/bpm" -H 'content-type: application/json' -d "$body")
          echo "$res"
          echo "$res" | jq -e '.results.GBUM70603730.bpm > 140 and .results.GBUM70603730.bpm < 150' >/dev/null \
            || { echo "::error::live BPM lookup did not return Rehab's tempo"; exit 1; }
          echo "$res" | jq -e '.results["africa|toto"].bpm > 85' >/dev/null \
            || { echo "::error::live search lookup failed for Africa"; exit 1; }
          rel=$(curl -sf -X POST "$URL/api/related" -H 'content-type: application/json' -d '{"artists":["The Strokes"]}')
          echo "$rel" | jq -c '.artists[0].related[:5] | map(.name)'
          echo "$rel" | jq -e '.artists[0].related | length > 3' >/dev/null || { echo "::error::related artists empty"; exit 1; }
          echo "Live checks passed: Rehab $(echo "$res" | jq '.results.GBUM70603730.bpm') BPM" >> "$GITHUB_STEP_SUMMARY"
