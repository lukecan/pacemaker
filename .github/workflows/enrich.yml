name: Look up BPM

# Runs in YOUR copy of the repo, against YOUR library, with YOUR API key.
# Nothing is sent anywhere else. Results are committed back to your repo so
# the next run resumes instead of starting over.

on:
  # Runs by itself whenever a library export is added or replaced.
  push:
    branches: [main]
    paths: ["library/**", ".github/workflows/enrich.yml"]
  workflow_dispatch:
    inputs:
      provider:
        description: "Where to look up BPM"
        type: choice
        default: deezer
        options:
          - deezer
          - getsongbpm
          - deezer,getsongbpm
      limit:
        description: "How many songs to try in this run"
        default: "300"
      delay:
        description: "Seconds to wait between requests"
        default: "0.7"
      retry_misses:
        description: "Try again the songs earlier runs could not find"
        type: boolean
        default: false
      discover:
        description: "Also look for new songs by artists like yours"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: pacemaker-data
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      # Always start from the latest main, not the commit that triggered the
      # run: an earlier run may have saved BPM results since then.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e .

      - name: Find the library export
        id: find
        run: |
          file=$(ls library/*.csv library/*.xml 2>/dev/null | head -1 || true)
          if [ -z "$file" ]; then
            echo "::error::No library export found. Add one .csv or .xml file to library/ first."
            exit 1
          fi
          echo "Using $file"
          echo "path=$file" >> "$GITHUB_OUTPUT"

      - name: Build the catalog and restore what is already known
        run: |
          pacemaker import-library "${{ steps.find.outputs.path }}"
          if [ -f discovery.csv ]; then pacemaker import-discovery discovery.csv; fi
          if [ -f bpm_state.csv ]; then pacemaker import-state bpm_state.csv; fi

      - name: Look up missing BPM values
        env:
          GETSONGBPM_API_KEY: ${{ secrets.GETSONGBPM_API_KEY }}
          PROVIDER: ${{ inputs.provider || 'deezer' }}
          LIMIT: ${{ inputs.limit || '5000' }}
          DELAY: ${{ inputs.delay || '0.7' }}
          RETRY: ${{ inputs.retry_misses || false }}
        run: |
          extra=""
          if [ "$RETRY" = "true" ]; then extra="--retry-misses"; fi
          pacemaker enrich --provider "$PROVIDER" --limit "$LIMIT" --delay "$DELAY" $extra

      - name: Discover new songs
        if: ${{ github.event_name == 'push' || inputs.discover }}
        run: pacemaker discover

      - name: Write the state file and the web catalog
        run: |
          mkdir -p web
          pacemaker export-state
          pacemaker export-discovery
          pacemaker export-catalog
          pacemaker report

      - name: Commit the results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bpm_state.csv discovery.csv web/catalog.json
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "chore: update BPM data [skip ci]"
            git pull --rebase origin main
            git push
          fi
