[project]
name = "pacemaker"
version = "0.1.0"
description = "Garmin running cadence -> BPM matched playlist from your own music library"
requires-python = ">=3.10"
dependencies = ["fitdecode", "pandas"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
pacemaker = "pacemaker.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
